name: interop
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tail -80

      - name: Run harness
        run: |
          set -o pipefail
          LINK="$(cat payload.txt)"
          echo "payload chars: ${#LINK}"
          swift run -c release PMInterop "$LINK" 2>&1 | tee harness-output.txt

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-output-${{ matrix.os }}
          path: harness-output.txt
